
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --page-bg: #eef4ff;
            --card-bg: #ffffff;
            --text: #1f2937;
            --muted: #4b5563;
            --primary: #1d4ed8;
            --primary-dark: #1e3a8a;
            --border: #cbd5e1;
            --focus: rgba(37, 99, 235, 0.18);
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: clamp(16px, 4vw, 40px) 15px;
            background: linear-gradient(135deg, var(--page-bg), #f9f9f9);
            color: var(--text);
        }

        main {
            width: min(100%, 800px);
            margin: 0 auto;
            padding: clamp(18px, 4vw, 32px);
            border: 1px solid #dbe3f0;
            border-radius: 18px;
            background: var(--card-bg);
            box-shadow: 0 10px 25px rgba(31, 41, 55, 0.12);
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            margin: 0 0 24px;
            color: var(--muted);
        }

        form {
            display: grid;
            gap: 20px;
        }

        fieldset {
            min-width: 0;
            border: 1px solid #dbe3f0;
            border-radius: 12px;
            padding: 20px;
            background: #f8fbff;
        }

        legend {
            font-weight: bold;
            color: var(--primary);
            padding: 0 10px;
        }

        .field {
            display: grid;
            grid-template-columns: minmax(150px, 0.7fr) minmax(0, 1.3fr);
            align-items: start;
            gap: 8px 16px;
            margin-bottom: 16px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field > label,
        .field > .field-label {
            padding-top: 10px;
            font-weight: 600;
            color: #374151;
        }

        input:not([type="radio"]):not([type="checkbox"]),
        select,
        textarea {
            width: 100%;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        button:focus-visible {
            border-color: var(--primary);
            outline: 3px solid var(--focus);
            outline-offset: 1px;
        }

        .password-control {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
        }

        .password-toggle {
            min-height: 42px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--primary-dark);
            font: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .password-toggle:hover {
            background: #f1f5fb;
        }

        .choices {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            align-items: center;
            min-height: 42px;
        }

        .choices label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }

        .choices input {
            accent-color: var(--primary);
        }

        input[type="range"] {
            accent-color: var(--primary);
        }

        input[type="color"] {
            min-height: 42px;
            padding: 5px;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 100%;
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        input[type="submit"] {
            flex: 1 1 200px;
            background: #2563eb;
            color: white;
        }

        input[type="submit"]:hover {
            background: #1d4ed8;
        }

        input[type="reset"] {
            flex: 1 1 160px;
            background: #e5e7eb;
            color: #111827;
        }

        input[type="reset"]:hover {
            background: #d1d5db;
        }

        @media (max-width: 600px) {
            fieldset {
                padding: 16px;
            }

            .field {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .field > label,
            .field > .field-label {
                padding-top: 0;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Job Application Form</h1>
        <p class="intro">Please fill out the form carefully.</p>

        <form>
            <fieldset>
                <legend>Personal Information</legend>

                <div class="field">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required minlength="3" autocomplete="name">
                </div>

                <div class="field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
                </div>

                <div class="field">
                    <label for="password">Password:</label>
                    <div class="password-control">
                        <input type="password" id="password" name="password" placeholder="Enter password" required minlength="8" autocomplete="new-password">
                        <button class="password-toggle" type="button" id="password-toggle" aria-controls="password" aria-pressed="false">Show</button>
                    </div>
                </div>

                <div class="field">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="1234567890" pattern="[0-9]{10}" required autocomplete="tel">
                </div>

                <div class="field">
                    <label for="website">Portfolio URL:</label>
                    <input type="url" id="website" name="website" placeholder="https://example.com">
                </div>

                <div class="field">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" min="18" max="60" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Job Details</legend>

                <div class="field">
                    <label for="job">Select Job:</label>
                    <select id="job" name="job" required>
                        <option value="">Choose Job</option>
                        <option value="developer">Web Developer</option>
                        <option value="designer">Web Designer</option>
                        <option value="manager">Manager</option>
                    </select>
                </div>

                <div class="field">
                    <span class="field-label" id="gender-label">Gender:</span>
                    <div class="choices" role="group" aria-labelledby="gender-label">
                        <label for="male"><input type="radio" id="male" name="gender" value="male"> Male</label>
                        <label for="female"><input type="radio" id="female" name="gender" value="female"> Female</label>
                    </div>
                </div>

                <div class="field">
                    <span class="field-label" id="skills-label">Skills:</span>
                    <div class="choices" role="group" aria-labelledby="skills-label">
                        <label for="html"><input type="checkbox" id="html" name="skills" value="html"> HTML</label>
                        <label for="css"><input type="checkbox" id="css" name="skills" value="css"> CSS</label>
                        <label for="js"><input type="checkbox" id="js" name="skills" value="javascript"> JavaScript</label>
                    </div>
                </div>

                <div class="field">
                    <label for="city">Select City:</label>
                    <input list="cities" id="city" name="city" placeholder="Enter your city">
                    <datalist id="cities">
                        <option value="Meerut">
                        <option value="Delhi">
                        <option value="Noida">
                        <option value="Mumbai">
                    </datalist>
                </div>

                <div class="field">
                    <label for="date">Available Date:</label>
                    <input type="date" id="date" name="date">
                </div>

                <div class="field">
                    <label for="time">Available Time:</label>
                    <input type="time" id="time" name="time">
                </div>

                <div class="field">
                    <label for="resume">Upload Resume:</label>
                    <input type="file" id="resume" name="resume">
                </div>

                <div class="field">
                    <label for="experience">Experience Level:</label>
                    <input type="range" id="experience" name="experience" min="0" max="10">
                </div>

                <div class="field">
                    <label for="color">Choose Theme Color:</label>
                    <input type="color" id="color" name="color">
                </div>

                <div class="field">
                    <label for="message">Why should we hire you?</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write something about yourself"></textarea>
                </div>
            </fieldset>

            <div class="form-actions">
                <input type="submit" value="Submit Application">
                <input type="reset" value="Reset Form">
            </div>
        </form>
    </main>
    <script>
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("password-toggle");

        if (passwordInput && passwordToggle) {
            passwordToggle.addEventListener("click", () => {
                const isHidden = passwordInput.type === "password";
                passwordInput.type = isHidden ? "text" : "password";
                passwordToggle.textContent = isHidden ? "Hide" : "Show";
                passwordToggle.setAttribute("aria-pressed", String(isHidden));
            });
        }
    </script>
</body>
</html>
