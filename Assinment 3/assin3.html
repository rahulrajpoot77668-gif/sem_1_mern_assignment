
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Big Styled Table</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>The Big Styled Table</h1>

<p class="subtitle">
Week 4 - 20 data rows x 10 columns • Illustrative expected output
</p>

<h3>Campus Store - T-Shirt Size & Stock Chart</h3>

<div class="table-wrapper">

<table>

<caption>Campus Store T-shirt sizes, measurements, stock, and prices</caption>

<thead>
<tr>
    <th rowspan="2" scope="col">Brand</th>
    <th rowspan="2" scope="col">SKU</th>
    <th rowspan="2" scope="col">Size</th>
    <th colspan="4" scope="colgroup">Measurements (inches)</th>
    <th rowspan="2" scope="col">Colour</th>
    <th rowspan="2" scope="col">Stock</th>
    <th rowspan="2" scope="col">Price</th>
</tr>

<tr>
    <th scope="col">Chest</th>
    <th scope="col">Waist</th>
    <th scope="col">Length</th>
    <th scope="col">Sleeve</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

</div>
</div>

<script src="assin3.js" defer></script>

</body>
</html>
