<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive photo gallery built with CSS Grid.">
  <title>Field Notes — Photo Gallery</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #f5f3ed;
      background: #171b19;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; }

    .page { width: min(1200px, 100% - 3rem); margin: 0 auto; padding: 2rem 0 4rem; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .brand { font-size: .95rem; font-weight: 700; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; }
    .back-link { color: #b7c1b8; font-size: .9rem; text-decoration: none; }
    .back-link:hover { color: #fff; }
    .eyebrow { margin: 4rem 0 .8rem; color: #b8d3ad; font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { max-width: 700px; margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 8vw, 6.5rem); font-weight: 400; letter-spacing: -.055em; line-height: .98; }
    .intro { max-width: 520px; margin: 1.2rem 0 2.5rem; color: #b7c1b8; line-height: 1.7; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: 190px;
      gap: 12px;
    }

    .photo { position: relative; min-width: 0; overflow: hidden; border-radius: 8px; background: #303832; }
    .photo img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .45s ease; }
    .photo:hover img { transform: scale(1.05); }
    .photo figcaption { position: absolute; inset: auto 0 0; padding: 2.5rem 1rem .85rem; background: linear-gradient(transparent, #111a); color: #fff; font-size: .9rem; }
    .photo-tall { grid-row: span 2; }
    .photo-wide { grid-column: span 2; }

    @media (max-width: 760px) {
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 170px; }
      .photo-wide { grid-column: span 2; }
    }

    @media (max-width: 430px) {
      .page { width: min(100% - 1.5rem, 1200px); }
      .gallery { gap: 8px; grid-auto-rows: 135px; }
      .photo figcaption { padding: 2rem .65rem .6rem; font-size: .8rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="assin7.html">Field Notes</a>
      <a class="back-link" href="assin7.html">← All Grid lessons</a>
    </header>
    <p class="eyebrow">01 / A collection of places</p>
    <h1>Somewhere, in the wild.</h1>
    <p class="intro">Nine moments gathered from open roads and quiet corners. The grid gives each photograph a place to breathe.</p>
    <section class="gallery" aria-label="Travel photography gallery">
      <figure class="photo photo-tall">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Mountain lake reflecting a range of peaks" fetchpriority="high">
        <figcaption>Still water, Norway</figcaption>
      </figure>
      <figure class="photo photo-wide">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=1200&amp;q=85" alt="Sunlit mountain peaks above a forest" loading="lazy">
        <figcaption>First light, the Alps</figcaption>
      </figure>
      <figure class="photo">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=700&amp;q=85" alt="Hiker looking across a distant mountain landscape" loading="lazy">
        <figcaption>Open country</figcaption>
      </figure>
      <figure class="photo">
        <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&amp;fit=crop&amp;w=700&amp;q=85" alt="Deer standing in a green forest" loading="lazy">
        <figcaption>Forest quiet</figcaption>
      </figure>
      <figure class="photo photo-wide">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&amp;fit=crop&amp;w=1200&amp;q=85" alt="A winding road crossing a wide open landscape" loading="lazy">
        <figcaption>The long way around</figcaption>
      </figure>
      <figure class="photo">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&amp;fit=crop&amp;w=700&amp;q=85" alt="Mountain valley with a clear blue lake" loading="lazy">
        <figcaption>Blue hour</figcaption>
      </figure>
      <figure class="photo">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&amp;fit=crop&amp;w=700&amp;q=85" alt="Sunlight filtering through tall evergreen trees" loading="lazy">
        <figcaption>Under the canopy</figcaption>
      </figure>
      <figure class="photo">
        <img src="https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&amp;fit=crop&amp;w=700&amp;q=85" alt="A trail leading through a quiet mountain valley" loading="lazy">
        <figcaption>Trail notes</figcaption>
      </figure>
      <figure class="photo">
        <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&amp;fit=crop&amp;w=700&amp;q=85" alt="Layered hills under a glowing evening sky" loading="lazy">
        <figcaption>Last light</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
