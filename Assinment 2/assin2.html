
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Job Application Form</h1>
        <p class="intro">Please fill out the form carefully.</p>

        <form>
            <fieldset>
                <legend>Personal Information</legend>

                <div class="field">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required minlength="3" autocomplete="name">
                </div>

                <div class="field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
                </div>

                <div class="field">
                    <label for="password">Password:</label>
                    <div class="password-control">
                        <input type="password" id="password" name="password" placeholder="Enter password" required minlength="8" autocomplete="new-password">
                        <button class="password-toggle" type="button" id="password-toggle" aria-controls="password" aria-pressed="false">Show</button>
                    </div>
                </div>

                <div class="field">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="1234567890" pattern="[0-9]{10}" required autocomplete="tel">
                </div>

                <div class="field">
                    <label for="website">Portfolio URL:</label>
                    <input type="url" id="website" name="website" placeholder="https://example.com">
                </div>

                <div class="field">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" min="18" max="60" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Job Details</legend>

                <div class="field">
                    <label for="job">Select Job:</label>
                    <select id="job" name="job" required>
                        <option value="">Choose Job</option>
                        <option value="developer">Web Developer</option>
                        <option value="designer">Web Designer</option>
                        <option value="manager">Manager</option>
                    </select>
                </div>

                <div class="field">
                    <span class="field-label" id="gender-label">Gender:</span>
                    <div class="choices" role="group" aria-labelledby="gender-label">
                        <label for="male"><input type="radio" id="male" name="gender" value="male"> Male</label>
                        <label for="female"><input type="radio" id="female" name="gender" value="female"> Female</label>
                    </div>
                </div>

                <div class="field">
                    <span class="field-label" id="skills-label">Skills:</span>
                    <div class="choices" role="group" aria-labelledby="skills-label">
                        <label for="html"><input type="checkbox" id="html" name="skills" value="html"> HTML</label>
                        <label for="css"><input type="checkbox" id="css" name="skills" value="css"> CSS</label>
                        <label for="js"><input type="checkbox" id="js" name="skills" value="javascript"> JavaScript</label>
                    </div>
                </div>

                <div class="field">
                    <label for="city">Select City:</label>
                    <input list="cities" id="city" name="city" placeholder="Enter your city">
                    <datalist id="cities">
                        <option value="Meerut">
                        <option value="Delhi">
                        <option value="Noida">
                        <option value="Mumbai">
                    </datalist>
                </div>

                <div class="field">
                    <label for="date">Available Date:</label>
                    <input type="date" id="date" name="date">
                </div>

                <div class="field">
                    <label for="time">Available Time:</label>
                    <input type="time" id="time" name="time">
                </div>

                <div class="field">
                    <label for="resume">Upload Resume:</label>
                    <input type="file" id="resume" name="resume">
                </div>

                <div class="field">
                    <label for="experience">Experience Level:</label>
                    <input type="range" id="experience" name="experience" min="0" max="10">
                </div>

                <div class="field">
                    <label for="color">Choose Theme Color:</label>
                    <input type="color" id="color" name="color">
                </div>

                <div class="field">
                    <label for="message">Why should we hire you?</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write something about yourself"></textarea>
                </div>
            </fieldset>

            <div class="form-actions">
                <input type="submit" value="Submit Application">
                <input type="reset" value="Reset Form">
            </div>
        </form>
    </main>
    <script src="assin2.js" defer></script>
</body>
</html>
